name: Bug report
description: Report incorrect behavior in mlock
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please include enough detail to reproduce.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The entry point(s) and the exact mlock call you ran.
      render: matlab
      placeholder: |
        mlock.lock("main.m", ProjectRoot="C:\proj")
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error / unexpected output
      render: text
    validations:
      required: true
  - type: input
    id: matlab
    attributes:
      label: MATLAB release
      placeholder: e.g. R2023b
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mlock version
      placeholder: e.g. v0.3.0
