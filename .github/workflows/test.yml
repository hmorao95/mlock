name: Test mlock

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: MATLAB tests (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Installs the latest released MATLAB. Licensing is handled automatically
      # for public repositories via MathWorks' hosted batch licensing.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest

      # Runs the tests in tests/. source-folder scopes code coverage to the
      # package itself (not the tests or examples); the test's setupOnce puts
      # the package parent on the MATLAB path so mlock.* resolves.
      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: +mlock
          select-by-folder: tests
          test-results-junit: test-results/results.xml
          code-coverage-cobertura: code-coverage/coverage.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: code-coverage/coverage.xml
          fail_ci_if_error: false          # don't fail the build on upload hiccups
          token: ${{ secrets.CODECOV_TOKEN }}   # optional; recommended for reliability

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/**
            code-coverage/**
          if-no-files-found: ignore
