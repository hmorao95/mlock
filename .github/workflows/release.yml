name: Release

# Build the mlock toolbox (.mltbx) and attach it to the GitHub Release whenever
# a version tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to upload release assets

jobs:
  package:
    name: Package .mltbx
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest

      - name: Build toolbox
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('tools'); package_toolbox('dist')

      - name: Attach .mltbx to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mltbx
